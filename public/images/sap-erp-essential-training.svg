  <rect x="60" y="45" width="1480" height="1041" fill="#ffffff" rx="12" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.06))"/>
  <rect x="75" y="60" width="1450" height="1011" fill="none" stroke="#e6eff0" stroke-width="1.5" rx="8"/>


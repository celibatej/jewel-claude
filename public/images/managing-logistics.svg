<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1131" width="1600" height="1131">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c7590"/>
      <stop offset="100%" stop-color="#375a72"/>
    </linearGradient>
    <linearGradient id="pmiRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea2083"/>
      <stop offset="100%" stop-color="#8a1f86"/>
    </linearGradient>
  </defs>

  <!-- Background base with soft geometric framing -->
  <rect width="1600" height="1131" fill="#f8fafb"/>
  
  <!-- Outer decorative borders -->
  <path d="M 0 0 L 1600 0 L 1600 180 L 1420 0 Z" fill="#9dbec5" opacity="0.35"/>
  <path d="M 0 0 L 0 240 L 220 0 Z" fill="#88b1b8" opacity="0.4"/>
  <path d="M 0 850 L 0 1131 L 320 1131 Z" fill="#9dbec5" opacity="0.4"/>
  <path d="M 1200 1131 L 1600 1131 L 1600 820 Z" fill="#7ba6ae" opacity="0.35"/>

  <!-- Inner crisp certificate card -->
  <rect x="60" y="45" width="1480" height="1041" fill="#ffffff" rx="12" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.06))"/>
  <rect x="75" y="60" width="1450" height="1011" fill="none" stroke="#e6eff0" stroke-width="1.5" rx="8"/>

  <!-- Top Brand: LinkedIn Learning -->
  <g transform="translate(800, 160)" text-anchor="middle">
    <text x="-48" y="0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0077b5">Linked</text>
    <rect x="2" y="-36" width="44" height="42" rx="7" fill="#0077b5"/>
    <text x="24" y="-5" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">in</text>
    <text x="135" y="0" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="44" font-weight="400" fill="#0a66c2">Learning</text>
  </g>

  <!-- Certificate Title -->
  <text x="800" y="320" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#18232c" text-anchor="middle" letter-spacing="0.5">
    Managing Logistics
  </text>

  <!-- Subtitle / Completion statement -->
  <text x="800" y="380" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#475569" text-anchor="middle">
    Course completed by <tspan font-weight="700" fill="#0f172a">Jobaedul Islam Jewel</tspan>
  </text>
  <text x="800" y="420" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="middle">
    Aug 23, 2026 at 07:13AM UTC
  </text>

  <!-- Top Skills Covered Section -->
  <text x="800" y="500" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1e293b" text-anchor="middle">
    Top skills covered
  </text>

  <!-- Skill Badges -->
  <g transform="translate(800, 560)">
    <rect x="-160" y="-26" width="320" height="52" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="0" y="8" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">Logistics Management</text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(800, 695)">
    <path d="M -140 10 Q -100 -50 -70 15 T -30 -30 T 20 20 T 70 -20 T 130 5" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -110 -20 L 110 -15" fill="none" stroke="#1e293b" stroke-width="1.8" opacity="0.6"/>
    <text x="0" y="55" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#334155" text-anchor="middle">
      Shea Hanson, Head of Learning Content Strategy
    </text>
  </g>

  <!-- Bottom Details & PMI Accreditation -->
  <!-- Left Side: PMI Authorized Training Partner Badge -->
  <g transform="translate(140, 810)">
    <!-- Circular PMI emblem -->
    <g transform="translate(50, 45)">
      <!-- Outer pink/purple ring -->
      <circle cx="0" cy="0" r="48" fill="#a22485"/>
      <circle cx="0" cy="0" r="43" fill="#040b2a"/>
      <!-- PMI Letters / Logo stylized -->
      <text x="0" y="-14" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">P<tspan fill="#ff007f">M</tspan><tspan fill="#00b0f0">I</tspan></text>
      <text x="0" y="6" font-family="Liberation Sans, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Authorized</text>
      <text x="0" y="16" font-family="Liberation Sans, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">Training Partner</text>
      <text x="0" y="29" font-family="Liberation Sans, Arial, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">2025</text>
    </g>

    <!-- PMI Legal text -->
    <g transform="translate(130, 20)">
      <text font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">
        <tspan x="0" dy="0">The PMI Registered Education Provider logo is a registered mark of the</tspan>
        <tspan x="0" dy="16">Project Management Institute, Inc.</tspan>
      </text>
    </g>
  </g>

  <!-- Middle/Right Column: PMI Provider Info & Cert ID -->
  <g transform="translate(760, 830)">
    <text font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#334155">
      <tspan x="0" dy="0"><tspan font-weight="600">Program:</tspan> PMI&#174; Registered Education Provider</tspan>
      <tspan x="0" dy="18"><tspan font-weight="600">Provider ID:</tspan> #4101</tspan>
      <tspan x="0" dy="18"><tspan font-weight="600">Activity #:</tspan> 4101FIMVKM</tspan>
      <tspan x="0" dy="18"><tspan font-weight="600">PDUs/ContactHours:</tspan> 0.50</tspan>
      <tspan x="0" dy="18"><tspan font-weight="600">Certificate ID:</tspan></tspan>
      <tspan x="0" dy="16" font-family="Courier, monospace" font-size="11" fill="#475569">7f8cf13af4f813a8db2c9a219b47fddee1229f9053bc18ab6c755f11461fc507</tspan>
    </text>
  </g>

  <!-- Bottom Right: Official Course Completion Badge -->
  <g transform="translate(1330, 915)">
    <circle cx="0" cy="0" r="72" fill="url(#badgeGrad)"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-42" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">&#9733; COURSE &#9733;</text>
    <rect x="-24" y="-22" width="48" height="44" rx="8" fill="#ffffff"/>
    <text x="0" y="10" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0077b5" text-anchor="middle">in</text>
    <text x="0" y="46" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">COMPLETION</text>
  </g>
</svg>